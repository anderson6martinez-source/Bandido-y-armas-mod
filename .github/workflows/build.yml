
name: Build Bandido Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check project
        shell: pwsh
        run: |
          Write-Host "Checking project..."
          Get-ChildItem -Recurse -File |
            Select-Object -ExpandProperty FullName

          if (!(Test-Path "./BandidoMod.csproj")) {
            throw "BandidoMod.csproj not found"
          }

      - name: Restore
        run: dotnet restore BandidoMod.csproj

      - name: Compile
        run: dotnet build BandidoMod.csproj --configuration Release --no-restore

      - name: Upload SCMod
        uses: actions/upload-artifact@v4
        with:
          name: Bandido24
          path: dist/Bandido24.scmod
          if-no-files-found: error
          
